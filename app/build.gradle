plugins {
        id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            }

            android {
                namespace 'com.allinone.v2adskip'
                    compileSdk 35

                        defaultConfig {
                                applicationId "com.allinone.v2adskip"
                                        minSdk 29
                                                targetSdk 35
                                                        versionCode 1
                                                                versionName "1.0"
                                                                        ndk {
                                                                                    abiFilters 'arm64-v8a'
                                                                                            }
                                                                                                }
                                                                                                    compileOptions {
                                                                                                            sourceCompatibility JavaVersion.VERSION_17
                                                                                                                    targetCompatibility JavaVersion.VERSION_17
                                                                                                                        }
                                                                                                                            kotlinOptions {
                                                                                                                                    jvmTarget = '17'
                                                                                                                                        }
                                                                                                                                        }

                                                                                                                                        dependencies {
                                                                                                                                            implementation fileTree(dir: 'libs', include: ['*.aar'])
                                                                                                                                            }
                                                                                                                                            
}