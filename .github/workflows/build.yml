name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
      runs-on: ubuntu-latest
          steps:
                - name: Checkout Code
                        uses: actions/checkout@v4

                              - name: Set up JDK 17
                                      uses: actions/setup-java@v4
                                              with:
                                                        distribution: 'temurin'
                                                                  java-version: '17'

                                                                        - name: Setup Android SDK
                                                                                uses: android-actions/setup-android@v3

                                                                                      - name: Download V2Ray/Xray Core (libv2ray.aar)
                                                                                              run: |
                                                                                                        mkdir -p app/libs
                                                                                                                  curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

                                                                                                                        - name: Generate Gradle Wrapper & Build APK
                                                                                                                                run: |
                                                                                                                                          gradle wrapper --gradle-version 8.5
                                                                                                                                                    ./gradlew assembleDebug --no-daemon

                                                                                                                                                          - name: Upload Compiled APK
                                                                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                                                                          with:
                                                                                                                                                                                    name: V2Ray-AdSkip-AllInOne
                                                                                                                                                                                              path: app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                                                                              